name: Publish
on:
  push:
    branches:
      - v2
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - uses: pnpm/action-setup@v4
      - run: |
          pnpm install
          pnpm build
      - name: Publish package
        run: npx jsr publish
